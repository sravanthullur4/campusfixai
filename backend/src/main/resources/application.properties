spring.application.name=campusfix-ai
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusfix?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:campusfix}
spring.datasource.password=${DB_PASSWORD:campusfix}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
campusfix.ai.provider=${AI_PROVIDER:mock}
campusfix.ai.openai.api-key=${OPENAI_API_KEY:}
campusfix.ai.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
campusfix.ai.gemini.api-key=${GEMINI_API_KEY:}
campusfix.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
